name: Discover Machines Italia URLs

on:
  push:
    branches:
      - main
    paths-ignore:
      - "data/discovered_urls.txt"
      - "data/changed_urls.txt"
      - "data/deleted_urls.txt"
      - "data/page_hashes.json"

  # schedule:
  #   - cron: "0 6 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Discover URLs and detect changes
        run: |
          python data/discover_urls.py

      - name: Show discovery results
        run: |
          echo "Discovery results"

          echo ""
          echo "Discovered URLs:"
          wc -l data/discovered_urls.txt

          echo ""
          echo "New / changed URLs:"
          wc -l data/changed_urls.txt

          echo ""
          echo "Deleted URLs:"
          wc -l data/deleted_urls.txt

          echo ""
          echo "Changed URLs:"
          cat data/changed_urls.txt || true

          echo ""
          echo "Deleted URLs:"
          cat data/deleted_urls.txt || true

      - name: Check for state changes
        id: changes
        run: |
          git add \
            data/discovered_urls.txt \
            data/changed_urls.txt \
            data/deleted_urls.txt \
            data/page_hashes.json

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No discovery or content changes detected."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Discovery or content changes detected."
          fi

      - name: Commit discovery state
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "chore: update Machines Italia content state"
          git push

      - name: Trigger n8n ingestion
        if: steps.changes.outputs.changed == 'true'
        env:
          N8N_INGEST_WEBHOOK_URL: ${{ secrets.N8N_INGEST_WEBHOOK_URL }}
        run: |
          if [ -z "$N8N_INGEST_WEBHOOK_URL" ]; then
            echo "ERROR: N8N_INGEST_WEBHOOK_URL is not configured."
            exit 1
          fi

          echo "Waiting briefly for GitHub raw content to update..."
          sleep 5

          echo "Triggering n8n ingestion..."

          curl --fail-with-body \
            --retry 3 \
            --retry-delay 5 \
            --retry-all-errors \
            -X POST \
            "$N8N_INGEST_WEBHOOK_URL"

          echo ""
          echo "n8n ingestion triggered successfully."