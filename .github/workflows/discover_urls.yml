name: Discover Machines Italia URLs

on:
  push:
    branches:
      - main

  schedule:
    - cron: "0 6 * * *"

  workflow_dispatch:

jobs:
  discover:
    # don't run again when the workflow itself pushes discovered_urls.txt
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Discover URLs
        run: |
          python data/discover_urls.py > data/discovered_urls.txt

          echo "Discovered URL count:"
          wc -l data/discovered_urls.txt

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet -- data/discovered_urls.txt; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes to discovered URLs"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "discovered_urls.txt changed"
          fi

      - name: Commit discovered URLs
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/discovered_urls.txt
          git commit -m "chore: update discovered URLs"
          git push

      - name: Trigger n8n ingestion
        if: steps.changes.outputs.changed == 'true'
        env:
          N8N_INGEST_WEBHOOK_URL: ${{ secrets.N8N_INGEST_WEBHOOK_URL }}
        run: |
          echo "Triggering n8n ingestion..."

          curl --fail-with-body \
            -X POST \
            "$N8N_INGEST_WEBHOOK_URL"