name: Discover Machines Italia URLs

on:
  push:
    branches:
      - main
    paths-ignore:
      - "data/discovered_urls.txt"
      - "data/changed_urls.txt"
      - "data/page_hashes.json"

  schedule:
    - cron: "0 6 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Discover URLs and detect changes
        run: |
          python data/discover_urls.py

          echo ""
          echo "================================"
          echo "Discovered URLs"
          echo "================================"
          wc -l data/discovered_urls.txt

          echo ""
          echo "================================"
          echo "Changed/New URLs"
          echo "================================"
          wc -l data/changed_urls.txt

          echo ""
          echo "Changed URLs:"
          cat data/changed_urls.txt || true

      - name: Check for changes
        id: changes
        run: |
          git add \
            data/discovered_urls.txt \
            data/changed_urls.txt \
            data/page_hashes.json

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No discovery/content changes"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Discovery/content changes detected"
          fi

      - name: Commit discovery state
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit \
            -m "chore: update Machines Italia content state"

          git push

