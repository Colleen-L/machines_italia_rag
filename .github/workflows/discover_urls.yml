name: Discover Machines Italia URLs

on:
  schedule:
    - cron: "0 6 * * *"

  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Discover URLs
        run: |
          python /data/discover_urls.py > data/discovered_urls.txt

      - name: Commit discovered URLs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add discovered_urls.txt

          if git diff --cached --quiet; then
            echo "No changes to discovered URLs"
          else
            git commit -m "chore: update discovered URLs"
            git push
          fi